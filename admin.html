<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>141/GANG/AWARD — Админ-панель</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #0a0000; min-height: 100vh; color: #fff; }
        .bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(ellipse at center, #1a0000 0%, #0a0000 40%, #000000 70%); z-index: 0; }
        .container { position: relative; z-index: 10; max-width: 1100px; margin: 0 auto; padding: 40px 20px; }
        .header { text-align: center; margin-bottom: 40px; }
        .header h1 { font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: clamp(24px, 5vw, 40px); letter-spacing: 5px; color: #fff; text-shadow: 0 0 20px rgba(220,0,0,0.5); }
        .header h1 .red { color: #cc0000; }
        .header p { color: rgba(255,255,255,0.4); font-size: 12px; letter-spacing: 3px; margin-top: 8px; }

        .login-box { text-align: center; padding: 40px; }
        .login-box input { padding: 12px 20px; background: rgba(20,0,0,0.8); border: 1px solid rgba(200,0,0,0.4); color: #fff; font-family: 'Orbitron', sans-serif; font-size: 14px; letter-spacing: 3px; text-align: center; width: 250px; outline: none; }
        .login-box input::placeholder { color: rgba(255,255,255,0.3); }
        .login-box button { display: block; margin: 15px auto 0; padding: 12px 40px; font-family: 'Orbitron', sans-serif; font-size: 13px; letter-spacing: 3px; text-transform: uppercase; background: rgba(180,0,0,0.8); color: #fff; border: 1px solid rgba(220,40,40,0.5); cursor: pointer; }
        .login-box .error { color: #f44; font-size: 11px; margin-top: 10px; }

        .dashboard { display: none; }
        .dashboard.visible { display: block; }

        .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; flex-wrap: wrap; gap: 10px; }
        .toolbar button { padding: 10px 20px; font-family: 'Orbitron', sans-serif; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; background: rgba(180,0,0,0.8); color: #fff; border: 1px solid rgba(220,40,40,0.5); cursor: pointer; }
        .toolbar .logout { background: rgba(100,100,100,0.5); border-color: #666; }
        .total { font-family: 'Orbitron', sans-serif; font-size: 13px; color: rgba(255,255,255,0.5); }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px; margin-bottom: 30px; }
        .nom-card { background: linear-gradient(160deg, rgba(25,0,0,0.9), rgba(5,0,0,0.95)); border: 1px solid rgba(180,0,0,0.25); padding: 18px; }
        .nom-card h3 { font-family: 'Orbitron', sans-serif; font-size: 14px; letter-spacing: 2px; color: #cc0000; margin-bottom: 12px; }
        .nom-card .result-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 13px; }
        .nom-card .result-row .name { color: #fff; }
        .nom-card .result-row .count { font-family: 'Orbitron', sans-serif; color: #0f0; font-size: 14px; }
        .nom-card .result-row.leader { background: rgba(0,255,0,0.05); }
        .nom-card .result-row.leader .name { color: #0f0; font-weight: 700; }

        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; }
        th { text-align: left; padding: 10px 12px; background: rgba(200,0,0,0.2); font-family: 'Orbitron', sans-serif; font-size: 10px; letter-spacing: 2px; color: #cc0000; }
        td { padding: 8px 12px; border-bottom: 1px solid rgba(255,255,255,0.05); color: rgba(255,255,255,0.7); }
        tr:hover td { background: rgba(200,0,0,0.05); }
        .refresh-note { text-align: center; color: rgba(255,255,255,0.3); font-size: 10px; margin-top: 20px; }

        @media(max-width:600px){ .stats-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="bg"></div>

    <div class="container">
        <div class="header">
            <h1>141<span class="red">/</span>GANG<span class="red">/</span>AWARD</h1>
            <p>АДМИН-ПАНЕЛЬ</p>
        </div>

        <div class="login-box" id="loginBox">
            <input type="password" id="passwordInput" placeholder="ПАРОЛЬ" onkeydown="if(event.key==='Enter')login()">
            <button onclick="login()">ВОЙТИ</button>
            <p class="error" id="loginError"></p>
        </div>

        <div class="dashboard" id="dashboard">
            <div class="toolbar">
                <button onclick="loadData()">ОБНОВИТЬ</button>
                <span class="total" id="totalVotes"></span>
                <button class="logout" onclick="logout()">ВЫЙТИ</button>
            </div>
            <div class="stats-grid" id="statsGrid"></div>
            <div class="table-wrap">
                <table id="votesTable">
                    <thead><tr><th>НОМИНАЦИЯ</th><th>НОМИНАНТ</th><th>ID</th><th>ВРЕМЯ</th></tr></thead>
                    <tbody id="votesBody"></tbody>
                </table>
            </div>
            <p class="refresh-note">Данные обновляются при нажатии «ОБНОВИТЬ»</p>
        </div>
    </div>

    <script>
    var PASSWORD = '141gang2026';
    var SUPABASE_URL = 'https://jkyknnaxjuelxqgwspty.supabase.co';
    var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpreWtubmF4anVlbHhxZ3dzcHR5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUwOTE0NDcsImV4cCI6MjEwMDY2NzQ0N30.Pm3aSqOu8kYDS-fYFAgb2C_LkJZA0QaoK5Ed1X2gG84';

    var allNoms = [
        '141/KING','141/QUEEN','CS2/СТРИМЕР/ГОДА','DOTA2/СТРИМЕР/ГОДА',
        'МУЛЬТИГЕЙМЕР/ГОДА','ОТКРЫТИЕ/ГОДА','ГЛАВНЫЙ/ЗАВОЗ/ГОДА',
        'МОДЕРАТОР/ГОДА','ПАРА/ГОДА','ИРЛ/СТРИМЕР/ГОДА','АФК/ГОДА',
        'ДУО/ГОДА','ПАБЛИК141/ГОДА','НАРЕЗЧИК/ГОДА','ЭДИТОР141/ГОДА',
        'ЛУЧШИЙ/141КОСПЛЕЙ/ГОДА','САМЫЙ/НАРОДНЫЙ/СТРИМЕР',
        'АУДИТОРИЯ141/ГОДА','ХАРИЗМА141/ГОДА','МЕМ141/ГОДА'
    ];

    function login(){
        if(document.getElementById('passwordInput').value === PASSWORD){
            document.getElementById('loginBox').style.display = 'none';
            document.getElementById('dashboard').classList.add('visible');
            localStorage.setItem('admin_auth', '1');
            loadData();
        } else {
            document.getElementById('loginError').textContent = 'НЕВЕРНЫЙ ПАРОЛЬ';
        }
    }

    function logout(){
        localStorage.removeItem('admin_auth');
        document.getElementById('loginBox').style.display = 'block';
        document.getElementById('dashboard').classList.remove('visible');
        document.getElementById('passwordInput').value = '';
    }

    function loadData(){
        fetch(SUPABASE_URL+'/rest/v1/votes?select=*&order=created_at.desc',{
            headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY}
        })
        .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
        .then(function(data){
            document.getElementById('totalVotes').textContent = 'ВСЕГО: '+data.length;
            buildStats(data);
            buildTable(data);
        })
        .catch(function(err){
            alert('Ошибка загрузки: '+err.message+'\n\nПроверь консоль (F12)');
            console.error(err);
        });
    }

    function buildStats(data){
        var grid = document.getElementById('statsGrid');
        var stats = {};
        allNoms.forEach(function(n){ stats[n] = {}; });
        data.forEach(function(row){
            if(!stats[row.nomination]) stats[row.nomination] = {};
            stats[row.nomination][row.nominee] = (stats[row.nomination][row.nominee]||0) + 1;
        });

        grid.innerHTML = '';
        allNoms.forEach(function(nom){
            var noms = stats[nom];
            var keys = Object.keys(noms).sort(function(a,b){ return noms[b]-noms[a]; });
            if(keys.length === 0) return;

            var card = document.createElement('div');
            card.className = 'nom-card';
            var html = '<h3>'+nom+'</h3>';
            keys.forEach(function(name,i){
                html += '<div class="result-row'+(i===0&&keys.length>1?' leader':'')+'"><span class="name">'+name+'</span><span class="count">'+noms[name]+'</span></div>';
            });
            card.innerHTML = html;
            grid.appendChild(card);
        });
    }

    function buildTable(data){
        var tbody = document.getElementById('votesBody');
        tbody.innerHTML = '';
        data.forEach(function(row){
            var tr = document.createElement('tr');
            var time = row.created_at ? new Date(row.created_at).toLocaleString('ru-RU') : '—';
            var id = (row.voter_id||'').substring(0,14);
            tr.innerHTML = '<td>'+row.nomination+'</td><td>'+row.nominee+'</td><td style="font-size:10px;opacity:0.5">'+id+'...</td><td>'+time+'</td>';
            tbody.appendChild(tr);
        });
    }

    if(localStorage.getItem('admin_auth')==='1'){
        document.getElementById('loginBox').style.display = 'none';
        document.getElementById('dashboard').classList.add('visible');
        loadData();
    }
    </script>
</body>
</html>
